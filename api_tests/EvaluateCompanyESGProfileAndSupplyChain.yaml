config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  variables:
    symbol: "AMZN"

scenarios:
  - name: Evaluate a company's ESG profile and supply chain
    flow:
      - get:
          url: "/stock/esg?symbol={{ symbol }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: totalESGScore
            - hasProperty: environmentScore
            - hasProperty: socialScore
            - hasProperty: governanceScore

      - get:
          url: "/stock/investment-theme?theme=financialExchangesData"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: theme
            - hasProperty: data

      - get:
          url: "/stock/supply-chain?symbol={{ symbol }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: symbol
            - hasProperty: data

      - log: "Comprehensive view of {{ symbol }}'s ESG profile and key business relationships retrieved"

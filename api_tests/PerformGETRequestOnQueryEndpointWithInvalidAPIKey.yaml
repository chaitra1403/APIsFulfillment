config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  payload:
    path: "PerformGETRequestOnQueryEndpointWithInvalidAPIKey.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}

scenarios:
  - name: "Perform a GET request on the /query endpoint with an invalid API key"
    flow:
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: "!200"
            - hasProperty: "errorMessage"
          log: "The response status code should not be 200 and the response should indicate an error"
      - think: 1

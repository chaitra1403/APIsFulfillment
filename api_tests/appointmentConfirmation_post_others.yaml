config:
  target: "{{ $processEnvironment.URL1_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "appointmentConfirmation_post_others.csv"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Test Error Conditions for Appointment Confirmation API"
    flow:
      - log: "Testing API with invalid payload (missing 'appointment' object)"
      - post:
          url: "/appointmentConfirmation"
          headers:
            Authorization: "Bearer {{ $processEnvironment.URL1_AUTH_TOKEN }}"
            Content-Type: "application/json"
          payload:
            customer:
              subscriberId: "VTAL001"
      - expect:
          statusCode: 400
          notHasProperty: "appointment"
          hasProperty: "customer.subscriberId"
      - think: 2

      - log: "Testing API with invalid authentication token"
      - post:
          url: "/appointmentConfirmation"
          headers:
            Authorization: "Bearer invalid_token"
            Content-Type: "application/json"
          payload:
            appointment:
              confirmation: true
              id: "SA-562403"
            customer:
              subscriberId: "VTAL001"
      - expect:
          statusCode: 401
          hasHeader: "WWW-Authenticate"
      - think: 2

      - log: "Testing API with incorrect URL"
      - post:
          url: "/appointmentConfirmations" # Note the typo
          headers:
            Authorization: "Bearer {{ $processEnvironment.URL1_AUTH_TOKEN }}"
            Content-Type: "application/json"
          payload:
            appointment:
              confirmation: true
              id: "SA-562403"
            customer:
              subscriberId: "VTAL001"
      - expect:
          statusCode: 404
      - think: 2

      - log: "Testing API with invalid value for 'confirmation' (string instead of boolean)"
      - post:
          url: "/appointmentConfirmation"
          headers:
            Authorization: "Bearer {{ $processEnvironment.URL1_AUTH_TOKEN }}"
            Content-Type: "application/json"
          payload:
            appointment:
              confirmation: "yes"
              id: "SA-562403"
            customer:
              subscriberId: "VTAL001"
      - expect:
          statusCode: 422
          hasProperty: "appointment.id"
          hasProperty: "customer.subscriberId"
      - think: 2

      - log: "Testing API with missing required 'subscriberId' field"
      - post:
          url: "/appointmentConfirmation"
          headers:
            Authorization: "Bearer {{ $processEnvironment.URL1_AUTH_TOKEN }}"
            Content-Type: "application/json"
          payload:
            appointment:
              confirmation: true
              id: "SA-562403"
            customer: {}
      - expect:
          statusCode: 422
          notHasProperty: "customer.subscriberId"
      - think: 2

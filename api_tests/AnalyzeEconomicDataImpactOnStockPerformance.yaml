config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 1
      arrivalRate: 1
  environments:
    production:
      vars:
        api_key: "{{ $processEnvironment.AUTH_TOKEN }}"

scenarios:
  - name: Analyze economic data impact on stock performance
    flow:
      - get:
          url: "/calendar/economic?from={{ $getDateMinusDays(30) }}&to={{ $getDate() }}"
          headers:
            X-Finnhub-Token: "{{ api_key }}"
          capture:
            - json: "$.economicCalendar[0].event"
              as: significant_event
            - json: "$.economicCalendar[0].time"
              as: event_date

      - get:
          url: "/economic?code={{ significant_event }}"
          headers:
            X-Finnhub-Token: "{{ api_key }}"

      - get:
          url: "/stock/candle?symbol=SPY&resolution=D&from={{ $toTimestamp(event_date) }}&to={{ $toTimestamp($getDatePlusDays(event_date, 7)) }}"
          headers:
            X-Finnhub-Token: "{{ api_key }}"

      - get:
          url: "/stock/metric?symbol=SPY&metric=all"
          headers:
            X-Finnhub-Token: "{{ api_key }}"

      - function: "analyzeImpact"

functions:
  analyzeImpact:
    - function: >
        function (context, ee, next) {
          console.log("Analyzing impact of economic event on stock performance");
          // Implement your analysis logic here
          return next();
        }

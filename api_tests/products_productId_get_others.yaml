      - log: "Testing with invalid product ID"
      - get:
          url: "/products/invalid_id"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
      - think: 1

      - log: "Testing with non-existent product ID"
      - get:
          url: "/products/999999"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1

      - log: "Testing without authorization"
      - get:
          url: "/products/{{ productId }}"
          expect:
            - statusCode: 401
      - think: 1

      - log: "Testing with invalid authorization token"
      - get:
          url: "/products/{{ productId }}"
          headers:
            Authorization: "Bearer invalid_token"
          expect:

config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  variables:
    company: "NVDA"

scenarios:
  - name: Analyze upcoming and past earnings
    flow:
      - get:
          url: "/calendar/earnings?from={{ $moment().add(1, 'day').format('YYYY-MM-DD') }}&to={{ $moment().add(1, 'month').format('YYYY-MM-DD') }}"
          headers:
            X-Finnhub-Token: "{{ $processEnvironment.AUTH_TOKEN }}"
        capture:
          - json: "$.earningsCalendar[?(@.symbol=='{{ company }}')].date"
            as: upcoming_earnings_date
        expect:
          - statusCode: 200
          - hasProperty: earningsCalendar

      - get:
          url: "/stock/earnings?symbol={{ company }}"
          headers:
            X-Finnhub-Token: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 200
          - hasProperty: symbol
          - isArray: "."
          - greaterThan:
              - length: "."
              - 0

      - get:
          url: "/stock/eps-estimate?symbol={{ company }}&freq=quarterly"
          headers:
            X-Finnhub-Token: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 200
          - hasProperty: data
          - isArray: "$.data"
          - greaterThan:
              - length: "$.data"
              - 0

      - get:
          url: "/company-news?symbol={{ company }}&from={{ $moment().subtract(1, 'month').format('YYYY-MM-DD') }}&to={{ $moment().format('YYYY-MM-DD') }}"
          headers:
            X-Finnhub-Token: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 200
          - isArray: "."
          - greaterThan:
              - length: "."
              - 0

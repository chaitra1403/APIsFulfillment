config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  variables:
    symbol: "MSFT"
scenarios:
  - name: Track insider transactions and ownership changes
    flow:
      - get:
          url: "/stock/insider-transactions?symbol={{ symbol }}&from=2023-01-01&to=2023-12-31"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "data"
            - hasProperty: "symbol"

      - get:
          url: "/stock/ownership?symbol={{ symbol }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "symbol"
            - hasProperty: "ownership"

      - get:
          url: "/stock/filings?symbol={{ symbol }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - isArray: true
            - nested:
                - path: "[0]"
                  expect:
                    - hasProperty: "symbol"
                    - hasProperty: "form"
                    - hasProperty: "filedDate"

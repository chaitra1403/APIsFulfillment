config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  payload:
    path: "{{ROOST_CSV_FILE_NAME}}"
    fields:
      - "symbol"
    skipHeader: true
  defaults:
    headers:
      Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"

scenarios:
  - name: Retrieve comprehensive company information
    flow:
      - get:
          url: "/stock/symbol?exchange=US"
          name: "List supported stocks"
      - get:
          url: "/stock/profile2?symbol={{ symbol }}"
          name: "Get company profile for {{ symbol }}"
      - get:
          url: "/stock/financials?symbol={{ symbol }}&statement=bs&freq=annual"
          name: "Get financial statements for {{ symbol }}"
      - get:
          url: "/stock/metric?symbol={{ symbol }}&metric=all"
          name: "Get basic financials for {{ symbol }}"
      - get:
          url: "/stock/recommendation?symbol={{ symbol }}"
          name: "Get analyst recommendations for {{ symbol }}"

config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  variables:
    symbol: "TSLA"

scenarios:
  - name: Analyze a stock for investment potential
    flow:
      - get:
          url: "/quote?symbol={{ symbol }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          capture:
            - json: $.c
              as: current_price
          expect:
            - statusCode: 200
            - hasProperty: c

      - get:
          url: "/stock/candle?symbol={{ symbol }}&resolution=D&from=1590988249&to=1591852249"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: c
            - hasProperty: t

      - get:
          url: "/stock/price-target?symbol={{ symbol }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: targetMean

      - get:
          url: "/stock/earnings?symbol={{ symbol }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - isArray: true

      - get:
          url: "/company-news?symbol={{ symbol }}&from=2023-01-01&to=2023-12-31"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - isArray: true

      - log: "Collected sufficient data for investment decision on {{ symbol }}"

config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    expect: {}
  payload:
    path: "query_get_others.csv"
    fields:
      - "symbol"
      - "apikey"
      - "function"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Non-Successful API requests"
    flow:
      - log: "Sending a GET request with invalid parameters"
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "error"
      - think: 1

      - log: "Sending a GET request with invalid URL"
      - get:
          url: "/invalidURL"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
      - think: 1

      - log: "Sending a GET request without Authorization header"
      - get:
          url: "/query?symbol={{ symbol }}&apikey={{ apikey }}&function={{ function }}"
          expect:
            - statusCode: 401
            - hasProperty: "error"
      - think: 1
